<body>
    <div id="banner" class="banner">
        <button id="menuBtn" class="menu-btn" title="看板设置">☰</button>
        <h1 id="bannerTitle" class="banner-title" title="点击编辑标题">又急看板 - UG KanBan</h1>
    </div>

    <div id="mainArea" class="main-area">
        <div id="swimlanesContainer" class="swimlanes-container"></div>
    </div>

    <div id="settingsSidebar" class="settings-sidebar">
        <div class="sidebar-header">
            <h2>看板设置</h2>
            <button id="closeSidebarBtn" class="close-btn">✕</button>
        </div>
        <div class="sidebar-content">
            <!-- 外观分组 -->
            <div class="sidebar-group">
                <h3 class="group-title">外观</h3>
                <div class="setting-row inline-row">
                    <label for="colorSchemeSelect">配色方案</label>
                    <select id="colorSchemeSelect"></select>
                </div>
                <div class="setting-row inline-row-slider">
                    <label for="globalTitleSize">全局卡片标题大小</label>
                    <input type="range" id="globalTitleSize" min="1" max="5" step="0.1" value="2.5">
                    <span id="globalTitleSizeVal">2.5%</span>
                </div>
                <div class="setting-row inline-row-slider">
                    <label for="globalBodySize">全局卡片正文大小</label>
                    <input type="range" id="globalBodySize" min="1" max="5" step="0.1" value="2.0">
                    <span id="globalBodySizeVal">2.0%</span>
                </div>
                <div class="setting-row inline-row">
                    <label for="enableMarkdownCheck">卡片正文使用 Markdown 语法渲染</label>
                    <input type="checkbox" id="enableMarkdownCheck">
                </div>
            </div>

            <!-- 导出分组 -->
            <div class="sidebar-group">
                <h3 class="group-title">导出</h3>
                <div class="setting-row inline-row-slider">
                    <label for="exportQuality">导出图片的质量</label>
                    <input type="range" id="exportQuality" min="20" max="100" step="1" value="65">
                    <span id="exportQualityVal">65%</span>
                </div>
                <div class="sidebar-actions">
                    <button id="exportImageBtn" class="action-btn">导出图片 (png)</button>
                    <button id="exportMarkdownBtn" class="action-btn">导出文档 (md)</button>
                    <button id="exportConfigBtn" class="action-btn">导出配置 (json)</button>
                </div>
            </div>

            <!-- 导入分组 -->
            <div class="sidebar-group">
                <h3 class="group-title">导入</h3>
                <div class="sidebar-actions">
                    <button id="loadMarkdownBtn" class="action-btn">导入文档 (md)</button>
                    <input type="file" id="loadMarkdownInput" accept=".md,.markdown">
                    <button id="loadConfigBtn" class="action-btn">导入配置 (json)</button>
                    <input type="file" id="loadConfigInput" accept=".json">
                </div>
            </div>

            <!-- 关于分组 -->
            <div class="sidebar-group">
                <h3 class="group-title">关于</h3>
                <div class="about-info">
                    <p><strong>版本：</strong><span></span></p>
                    <p><strong>作者：</strong><span></span></p>
                    <!--<p><strong>主页：</strong><a href="https://your-homepage.com" target="_blank" style="color: var(--color-swimlane-edge);">your-homepage.com</a></p>-->
                    <!--<p><strong>GitHub：</strong><a href="https://github.com/your-repo" target="_blank" style="color: var(--color-swimlane-edge);">github.com/your-repo</a></p>-->
                </div>
            </div>

        </div>
    </div>

    <div id="sidebarOverlay" class="sidebar-overlay"></div>

    <div id="contextMenu" class="context-menu" style="display:none;"></div>

    <div id="modalOverlay" class="modal-overlay" style="display:none;">
        <div id="modalDialog" class="modal-dialog">
            <h3 id="modalTitle">修改卡片样式</h3>
            <div class="modal-body" id="modalBody"></div>
            <div class="modal-footer">
                <button id="btnClearStyle" class="btn-clear-style">清空样式</button>
                <div class="footer-spacer"></div>
                <button id="modalCancelBtn">取消</button>
                <button id="modalConfirmBtn">确定</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast" style="display:none;"></div>

</body>
</html>
